# Service-owned (not generated by sdk-kit): lint settings of the live checks, same rules as the
# Python package (python/pyproject.toml).
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "S", "A", "C4", "SIM", "RET", "PT", "RUF", "N", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0917",
  "PLC0415", # the SDK is imported after the credential check, so a skip needs no install
]

[format]
quote-style = "double"
