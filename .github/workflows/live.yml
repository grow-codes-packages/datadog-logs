# Service-owned (not generated by sdk-kit): live checks of the Python package against the real
# Datadog Log Management API (GRO-1385). Sends logs with a unique marker and reads them back
# through the Logs Search API (live/live_test.py, see docs/compatibility.md "Live checks").
#
# Organisation secrets: DATADOG_API_KEY, DATADOG_APP_KEY (logs_read_data + logs_read_config).
# Organisation variable: DATADOG_SITE (default datadoghq.eu).
# Without the two secrets the run ends green with a notice and the live job is skipped.
name: live

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC

permissions:
  contents: read

concurrency:
  group: live-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  credentials:
    name: credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the live secrets
        id: check
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          missing=""
          [ -n "$DATADOG_API_KEY" ] || missing="$missing DATADOG_API_KEY"
          [ -n "$DATADOG_APP_KEY" ] || missing="$missing DATADOG_APP_KEY"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live checks skipped::secrets not set:$missing (add them as organisation secrets to run the live checks)"
            echo "Live checks skipped: secrets not set:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  live:
    name: live (python)
    needs: credentials
    if: needs.credentials.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Lint the live suite
        run: make -C live PYTHON="${{ steps.python.outputs.python-path }}" lint

      - name: Live checks
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
          DATADOG_SITE: ${{ vars.DATADOG_SITE || 'datadoghq.eu' }}
        run: make -C live PYTHON="${{ steps.python.outputs.python-path }}" live
